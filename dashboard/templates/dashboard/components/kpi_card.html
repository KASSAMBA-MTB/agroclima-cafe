<div class="kpi-card">

    <!-- ==========================================================
         CABEÇALHO
    =========================================================== -->

    <div class="kpi-header">

        <div class="kpi-icon {{ color }}">

            <i class="bi {{ icon }}"></i>

        </div>

        {% if variation %}

        <span class="kpi-variation">

            {{ variation }}

        </span>

        {% endif %}

    </div>

    <!-- ==========================================================
         CONTEÚDO
    =========================================================== -->

    <div class="kpi-body">

        <span class="kpi-title">

            {{ title }}

        </span>

        <h2 class="kpi-value">

            {{ value }}

            {% if unit %}

                <small class="kpi-unit">

                    {{ unit }}

                </small>

            {% endif %}

        </h2>

        {% if description %}

        <p class="kpi-description">

            {{ description }}

        </p>

        {% endif %}

    </div>

    <!-- ==========================================================
         RODAPÉ
    =========================================================== -->

    <div class="kpi-footer">

        <div class="kpi-update">

            <i class="bi bi-arrow-repeat"></i>

            <small>

                Atualizado às

                {{ ultima_atualizacao|date:"H:i" }}

            </small>

        </div>

        {% if trend %}

        <div class="kpi-trend">

            {{ trend }}

        </div>

        {% endif %}

    </div>

</div>
